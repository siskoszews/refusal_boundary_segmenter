[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "siskoszews-refusal_boundary_segmenter"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对Agent 编排平台工程师·拒答边界与过度拒答相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "siskoszews" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://siskoszews.github.io"
Repository = "https://github.com/siskoszews/refusal_boundary_segmenter"
Issues = "https://github.com/siskoszews/refusal_boundary_segmenter/issues"

[project.scripts]
refusal_boundary_segmenter = "refusal_boundary_segmenter:main"

[tool.setuptools]
py-modules = ["refusal_boundary_segmenter"]
